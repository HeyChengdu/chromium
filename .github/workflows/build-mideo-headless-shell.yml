name: Build Mideo Headless Shell

on:
  workflow_dispatch:
    inputs:
      build_commit:
        description: 编译源码完整SHA，留空使用当前提交；恢复脚本可独立修复
        type: string
        default: ''
      resume_run:
        description: 相同提交的 checkpoint 运行 ID，首次留空
        type: string
        default: ''
      media_only:
        description: 仅获取固定 FFmpeg 产物，不编译 Chromium
        type: boolean
        default: false
  push:
    branches: [mideo-raw-frame-capture]

concurrency:
  group: mideo-headless-${{ github.ref }}-${{ inputs.media_only == true && 'media' || 'full' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  linux-x64:
    if: ${{ inputs.media_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_COMMIT: ${{ inputs.build_commit || github.sha }}
    steps:
      - name: Record resources and reclaim hosted runner disk
        run: |
          mkdir -p build-diagnostics
          date +%s > build-diagnostics/job-start.txt
          { nproc; free -h; df -h; } | tee build-diagnostics/resources-before.txt
          # 仅清理一次性的 GitHub 托管虚拟机中与 Linux Chromium 无关的工具链。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get clean
          { nproc; free -h; df -h; } | tee build-diagnostics/resources-after.txt
          python3 - <<'PYTHON'
          import os, shutil
          memory = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES')
          disk = shutil.disk_usage('.').free
          assert memory >= 12 * 1024**3, 'Requires at least 12 GiB RAM'
          assert disk >= 45 * 1024**3, 'Insufficient disk even for a constrained build attempt'
          PYTHON

      - uses: actions/checkout@v4
        with:
          path: controller
          sparse-checkout: tools/mideo

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_COMMIT }}
          path: src
          fetch-depth: 1

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Synchronize Chromium dependencies
        timeout-minutes: 100
        run: |
          cat > .gclient <<'EOF'
          solutions = [{
            "name": "src",
            "url": "https://github.com/HeyChengdu/chromium.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {},
          }]
          target_os = ["linux"]
          EOF
          gclient sync --no-history --shallow --nohooks --jobs 4 --revision "src@$BUILD_COMMIT" 2>&1 | tee build-diagnostics/sync.log
          test "$(git -C src rev-parse HEAD)" = "$BUILD_COMMIT"

      - name: Install Linux build dependencies
        working-directory: src
        run: |
          sudo build/install-build-deps.sh --no-prompt --no-chromeos-fonts
          gclient runhooks

      - name: Restore exact-source checkpoint
        if: ${{ inputs.resume_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          run_id = os.environ['RESUME_RUN']
          assert run_id.isdigit()
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/HeyChengdu/chromium/actions/runs/{run_id}']))
          assert run['head_sha'] == os.environ['BUILD_COMMIT'] and run['status'] == 'completed'
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', 'HeyChengdu/chromium', '--name', 'mideo-checkpoint-' + os.environ['BUILD_COMMIT'], '--dir', 'checkpoint'], check=True)
          PYTHON
          (cd checkpoint && sha256sum -c SHA256SUMS)
          cd src
          python3 ../controller/tools/mideo/checkpoint.py restore ../checkpoint/inputs.json.gz
          tar --zstd -xf ../checkpoint/out.tar.zst
          rm ../checkpoint/out.tar.zst

      - name: Generate release build
        working-directory: src
        run: |
          gn gen out/Mideo --args='is_debug=false is_component_build=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 use_remoteexec=false use_siso=false chrome_pgo_phase=0 treat_warnings_as_errors=true enable_pdf=false enable_printing=false use_cups=false enable_plugins=false headless_enable_commands=false'

      - name: Check V8 metadata query before compilation
        working-directory: src
        run: gn desc out/Mideo '//v8:v8_base_without_compiler(//build/toolchain/linux:clang_x64)' --format=json > ../build-diagnostics/v8-compile-flags.json

      - name: Record inputs for resumable build
        working-directory: src
        run: |
          mkdir -p ../checkpoint
          python3 ../controller/tools/mideo/checkpoint.py snapshot ../checkpoint/inputs.json.gz

      - name: Build headless shell with six workers
        id: build
        working-directory: src
        run: |
          # 270分钟编译预算，为保存中间产物留出余量；6小时仍为job硬上限。
          vmstat 30 > ../build-diagnostics/vmstat.log &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          set +e
          elapsed=$(( $(date +%s) - $(cat ../build-diagnostics/job-start.txt) ))
          budget=$(( 300 * 60 - elapsed ))
          if [ "$budget" -gt 16200 ]; then budget=16200; fi
          if [ "$budget" -le 0 ]; then echo '准备阶段耗尽编译预算'; exit 1; fi
          timeout --signal=INT --kill-after=60s "${budget}s" autoninja -C out/Mideo -j 6 headless_shell > >(tee ../build-diagnostics/build.log) 2>&1
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then exit "$result"; fi
          if [ "$result" = 0 ]; then echo 'complete=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save resumable output
        if: ${{ steps.build.outputs.exit_code == '124' }}
        working-directory: src
        run: |
          tar --zstd -cf ../checkpoint/out.tar.zst out/Mideo
          cd ../checkpoint
          sha256sum inputs.json.gz out.tar.zst > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: ${{ steps.build.outputs.exit_code == '124' }}
        with:
          name: mideo-checkpoint-${{ env.BUILD_COMMIT }}
          path: checkpoint/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Mark checkpoint continuation required
        if: ${{ steps.build.outputs.exit_code == '124' }}
        run: |
          echo '编译窗口结束，checkpoint已保存；使用相同提交和本次run ID续跑。'
          exit 1

      - name: Package runtime
        working-directory: src
        run: |
          mkdir -p artifact/locales
          cp out/Mideo/headless_shell artifact/
          find out/Mideo -maxdepth 1 -type f \( -name '*.pak' -o -name '*.bin' -o -name '*.dat' \) -exec cp {} artifact/ \;
          if [ -d out/Mideo/locales ]; then cp -a out/Mideo/locales/. artifact/locales/; fi
          find out/Mideo -maxdepth 1 -type f -name '*.so' -exec cp {} artifact/ \;
          if [ -d out/Mideo/swiftshader ]; then cp -a out/Mideo/swiftshader artifact/; fi
          cp docs/mideo-shared-frame-buffer.md artifact/
          printf '%s\n' "$BUILD_COMMIT" > artifact/chromium-commit.txt
          tar -C artifact -czf mideo-headless-shell-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-headless-shell-${{ env.BUILD_COMMIT }}
          path: src/mideo-headless-shell-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Collect final resource usage
        if: always()
        run: |
          { free -h; df -h; du -sh src/out src/third_party 2>/dev/null || true; } > build-diagnostics/resources-final.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mideo-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-diagnostics/
            checkpoint/restore-differences.json
          retention-days: 14

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mideo
      - name: Fetch independently built FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/mideo/fetch-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-media-${{ github.sha }}
          path: media-artifact/
          retention-days: 14

  verify:
    needs: [linux-x64, media]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mideo
      - uses: actions/download-artifact@v4
        with:
          name: candidate-headless-shell-${{ inputs.build_commit || github.sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-media-${{ github.sha }}
          path: runtime
      - name: Verify pixels, frame ordering, encoding and capture latency
        timeout-minutes: 30
        run: |
          tar -xzf candidate/mideo-headless-shell-linux-x64.tar.gz -C runtime
          chmod +x runtime/ffmpeg runtime/ffprobe runtime/headless_shell
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 fonts-noto-cjk
          python3 -m venv .venv
          .venv/bin/pip install websocket-client==1.8.0 Pillow==11.3.0
          .venv/bin/python tools/mideo/shared_frame_buffer_smoke.py "$PWD/runtime/headless_shell" "$PWD/runtime/ffmpeg" --report runtime/validation.json
      - name: Package verified runtime and source adapters
        run: |
          cp -a tools/mideo runtime/source-adapters
          tar -C runtime -czf mideo-shared-runtime-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mideo-shared-runtime-linux-x64-${{ github.sha }}
          path: mideo-shared-runtime-linux-x64.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mideo-validation-${{ github.sha }}
          path: |
            runtime/validation.json
            runtime/verification/
          if-no-files-found: warn
          retention-days: 14
