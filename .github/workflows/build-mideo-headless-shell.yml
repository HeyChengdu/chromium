name: Build Mideo Headless Shell

on:
  workflow_dispatch:
    inputs:
      media_only:
        description: 仅构建 FFmpeg，共享内存端到端验收仍需完整构建
        type: boolean
        default: false
  push:
    branches: [mideo-raw-frame-capture]

concurrency:
  group: mideo-headless-${{ github.ref }}-${{ inputs.media_only == true && 'media' || 'full' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-x64:
    if: ${{ inputs.media_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Record resources and reclaim hosted runner disk
        run: |
          mkdir -p build-diagnostics
          { nproc; free -h; df -h; } | tee build-diagnostics/resources-before.txt
          # 仅清理一次性的 GitHub 托管虚拟机中与 Linux Chromium 无关的工具链。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get clean
          { nproc; free -h; df -h; } | tee build-diagnostics/resources-after.txt
          python3 - <<'PYTHON'
          import os, shutil
          memory = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES')
          disk = shutil.disk_usage('.').free
          assert memory >= 12 * 1024**3, 'Requires at least 12 GiB RAM'
          assert disk >= 45 * 1024**3, 'Insufficient disk even for a constrained build attempt'
          PYTHON

      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Synchronize Chromium dependencies
        timeout-minutes: 100
        run: |
          cat > .gclient <<'EOF'
          solutions = [{
            "name": "src",
            "url": "https://github.com/HeyChengdu/chromium.git",
            "managed": False,
            "custom_deps": {},
            "custom_vars": {},
          }]
          target_os = ["linux"]
          EOF
          gclient sync --no-history --shallow --nohooks --jobs 4 --revision "src@$GITHUB_SHA" 2>&1 | tee build-diagnostics/sync.log
          test "$(git -C src rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Linux build dependencies
        working-directory: src
        run: |
          sudo build/install-build-deps.sh --no-prompt --no-chromeos-fonts
          gclient runhooks

      - name: Generate release build
        working-directory: src
        run: |
          gn gen out/Mideo --args='is_debug=false is_component_build=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 use_remoteexec=false use_siso=false chrome_pgo_phase=0 treat_warnings_as_errors=true enable_pdf=false enable_printing=false use_cups=false enable_plugins=false headless_enable_commands=false'

      - name: Compile modified translation units first
        working-directory: src
        run: python3 tools/mideo/check-changed-units.py

      - name: Build headless shell
        working-directory: src
        run: |
          set -o pipefail
          # 仅使用任务的 360 分钟上限，不再提前结束编译。
          vmstat 30 > ../build-diagnostics/vmstat.log &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          autoninja -C out/Mideo -j 4 headless_shell 2>&1 | tee ../build-diagnostics/build.log

      - name: Package runtime
        working-directory: src
        run: |
          mkdir -p artifact/locales
          cp out/Mideo/headless_shell artifact/
          find out/Mideo -maxdepth 1 -type f \( -name '*.pak' -o -name '*.bin' -o -name '*.dat' \) -exec cp {} artifact/ \;
          if [ -d out/Mideo/locales ]; then cp -a out/Mideo/locales/. artifact/locales/; fi
          find out/Mideo -maxdepth 1 -type f -name '*.so' -exec cp {} artifact/ \;
          if [ -d out/Mideo/swiftshader ]; then cp -a out/Mideo/swiftshader artifact/; fi
          cp docs/mideo-shared-frame-buffer.md artifact/
          printf '%s\n' "$GITHUB_SHA" > artifact/chromium-commit.txt
          tar -C artifact -czf mideo-headless-shell-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-headless-shell-${{ github.sha }}
          path: src/mideo-headless-shell-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Collect final resource usage
        if: always()
        run: |
          { free -h; df -h; du -sh src/out src/third_party 2>/dev/null || true; } > build-diagnostics/resources-final.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mideo-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-diagnostics/
          retention-days: 14

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mideo
      - name: Build matching FFmpeg with shared input
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config build-essential zlib1g-dev
          python3 tools/mideo/build-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-media-${{ github.sha }}
          path: media-artifact/
          retention-days: 14

  verify:
    needs: [linux-x64, media]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mideo
      - uses: actions/download-artifact@v4
        with:
          name: candidate-headless-shell-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-media-${{ github.sha }}
          path: runtime
      - name: Verify pixels, frame ordering, encoding and capture latency
        timeout-minutes: 30
        run: |
          tar -xzf candidate/mideo-headless-shell-linux-x64.tar.gz -C runtime
          chmod +x runtime/ffmpeg runtime/ffprobe runtime/headless_shell
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 fonts-noto-cjk
          python3 -m venv .venv
          .venv/bin/pip install websocket-client==1.8.0 Pillow==11.3.0
          .venv/bin/python tools/mideo/shared_frame_buffer_smoke.py "$PWD/runtime/headless_shell" "$PWD/runtime/ffmpeg" --report runtime/validation.json
      - name: Package verified runtime and source adapters
        run: |
          cp -a tools/mideo runtime/source-adapters
          tar -C runtime -czf mideo-shared-runtime-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mideo-shared-runtime-linux-x64-${{ github.sha }}
          path: mideo-shared-runtime-linux-x64.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mideo-validation-${{ github.sha }}
          path: |
            runtime/validation.json
            runtime/verification/
          if-no-files-found: warn
          retention-days: 14
